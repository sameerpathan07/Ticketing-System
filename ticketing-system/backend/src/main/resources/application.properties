# ============================================
# Ticketing System - Application Configuration
# ============================================
spring.application.name=ticketing-system
server.port=8080

# Default profile uses H2 (in-memory) for easy local run.
# Switch to 'postgres' profile to use PostgreSQL: --spring.profiles.active=postgres
#spring.profiles.active=h2
spring.profiles.active=mysql

# Common JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:Y2hhbmdlLW1lLXRoaXMtaXMtYS12ZXJ5LWxvbmctc2VjcmV0LWtleS1mb3ItaG1hYy1zaGEyNTYtMzItYnl0ZXMtbWluaW11bQ==}
app.jwt.expiration-ms=86400000

# File upload (for ticket attachments)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:./uploads}

# Mail (good-to-have: email notifications). Defaults to disabled.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:noreply@ticketing.local}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_TLS:false}

# Logging
logging.level.com.leapscholar.ticketing=INFO
logging.level.org.springframework.security=INFO

# CORS (frontend origin)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}
